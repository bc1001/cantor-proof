name: Build Proof and Export Artifacts

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Lean 4 via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Update Dependencies and Generate lake-manifest.json
        run: lake update

      - name: Fetch Mathlib Cache
        run: lake exe cache get

      - name: Build Proof (.olean)
        run: lake build

      - name: "Export Plaintext AST (Scheme 1)"
        run: |
          # 修正为官方正版仓库 leanprover/lean4export
          git clone https://github.com/leanprover/lean4export.git
          cd lean4export
          # 保证导出器与你的 v4.35.0-rc4 工具链完全一致
          cp ../lean-toolchain . || true
          lake build
          cd ..
          lake env ./lean4export/.lake/build/bin/lean4export StrictFormalConjecture1 > proof_independent.out

      - name: Upload All Proof Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proof-artifacts
          path: |
            lake-manifest.json
            proof_independent.out
            .lake/build/lib/
