name: Build and Verify Proof with Comparator

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Lean 4 via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Update Dependencies and Generate lake-manifest.json
        run: lake update

      - name: Fetch Mathlib Cache
        run: lake exe cache get

      - name: Build Modules
        run: lake build

      - name: Run Formal Comparator Verification
        run: |
          # 1. 写入临时比对脚本
          cat << 'EOF' > check_comparator.lean
          import Lean

          open Lean

          def main : IO Unit := do
            let envChallenge ← importModules #[{ module := `Conjecture1_Comparator }] {}
            let envSolution ← importModules #[{ module := `StrictFormalConjecture1 }] {}
            
            let targetName := `StrictFormalConjecture1.Conjecture1
            IO.println s!"=== Comparator AST Verification for {targetName} ==="
            
            match envChallenge.find? targetName, envSolution.find? targetName with
            | some c1, some c2 =>
              if c1.type == c2.type then
                IO.println "✔ Comparator verified: Target theorem types are identical (0 drift)!"
              else
                throw <| IO.userError "Type mismatch: Solution changed the theorem statement!"
            | none, _ =>
              throw <| IO.userError s!"Challenge does not declare {targetName}!"
            | _, none =>
              throw <| IO.userError s!"Solution does not declare {targetName}!"
          EOF

          # 2. 运行比对脚本
          lake env lean --run check_comparator.lean
